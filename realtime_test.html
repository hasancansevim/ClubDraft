<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubCraft RealtimeHub Test</title>
    <!-- Use CDN for SignalR client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.12/signalr.min.js"></script>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        h2 { color: #569cd6; }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .time { color: #4ec9b0; margin-right: 10px; }
        .event-name { color: #ce9178; font-weight: bold; margin-right: 10px; }
        .payload { color: #9cdcfe; }
    </style>
</head>
<body>
    <h2>RealtimeHub E2E Event Monitor</h2>
    <div id="status">Connecting...</div>
    <div id="logs" style="margin-top: 20px; border: 1px solid #333; padding: 10px; height: 500px; overflow-y: auto;"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId') || 'R1';
        const userId = urlParams.get('userId') || 'U1';

        document.getElementById('status').innerText = `Connecting to Hub for Room: ${roomId}, User: ${userId}...`;

        const connection = new signalR.HubConnectionBuilder()
            .withUrl(`http://localhost:5010/gameHub?roomId=${roomId}&userId=${userId}`)
            .configureLogging(signalR.LogLevel.Information)
            .build();

        function logEvent(eventName, payload) {
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.innerText = new Date().toLocaleTimeString();
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'event-name';
            nameSpan.innerText = eventName;
            
            const payloadSpan = document.createElement('span');
            payloadSpan.className = 'payload';
            payloadSpan.innerText = JSON.stringify(payload);
            
            entry.appendChild(timeSpan);
            entry.appendChild(nameSpan);
            entry.appendChild(payloadSpan);
            
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${eventName}]`, payload);
        }

        // Event listeners corresponding to EventConsumers.cs
        const events = [
            "onRoomCreated", "onParticipantJoined", "onDraftReady", "onWeekAdvanceReady",
            "onPlayerClaimed", "onPlayerClaimRejected", "onDraftTurnAdvanced",
            "onDraftCompleted", "onMatchResult", "onWeekAdvanced", "onSponsorshipOffered"
        ];

        events.forEach(ev => {
            connection.on(ev, (data) => logEvent(ev, data));
        });

        connection.start().then(function () {
            document.getElementById('status').innerText = `✅ Connected to Room: ${roomId}`;
            document.getElementById('status').style.color = '#4ec9b0';
        }).catch(function (err) {
            document.getElementById('status').innerText = `❌ Connection Error: ${err.toString()}`;
            document.getElementById('status').style.color = '#f44336';
            return console.error(err.toString());
        });
    </script>
</body>
</html>
